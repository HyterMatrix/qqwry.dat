name: Release

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0,12 * * 1,3,5'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: pnpm/action-setup@v6
        with:
          version: 9
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DOWNLOAD_TOKEN: ${{ secrets.DOWNLOAD_TOKEN }}
          CZDB_TOKEN: ${{ secrets.CZDB_TOKEN }}
        run: |
          pnpm i
          pnpm run build
